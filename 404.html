<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f8faf7">
  <title>Página não encontrada | Conecta</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f8faf7;
      color: #153d30;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; min-height: 100svh; }
    a { color: inherit; }
    .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 30px clamp(22px, 5vw, 70px); }
    .brand { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 24px; font-weight: 800; letter-spacing: -1.3px; text-decoration: none; line-height: 1; }
    .brand svg { width: 31px; height: 31px; flex: none; }
    .brand .dot { color: #34a472; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 54px 0 95px; }
    .content { text-align: center; max-width: 560px; width: 100%; }
    .code { margin: 0 0 20px; font-size: clamp(85px, 15vw, 132px); font-weight: 800; letter-spacing: -9px; line-height: 1; color: #dce9df; }
    h1 { margin: 0 0 14px; font-size: clamp(27px, 4vw, 38px); font-weight: 750; line-height: 1.18; letter-spacing: -1.4px; }
    p { margin: 0 auto 31px; max-width: 400px; font-size: 15px; line-height: 1.65; color: #63756b; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 49px; padding: 0 29px; background: #176b4b; color: white; font-size: 14px; font-weight: 700; border-radius: 11px; text-decoration: none; transition: background-color .15s ease; }
    .button:hover, .button:focus-visible { background: #10543a; }
    .button:focus-visible, .brand:focus-visible { outline: 3px solid #73c39e; outline-offset: 4px; }
    footer { text-align: center; font-size: 12px; color: #89998e; }
    @media (max-width: 600px) { .page { padding: 25px 22px; } main { padding: 30px 0 70px; } .code { letter-spacing: -5px; } h1 { letter-spacing: -.8px; } p { font-size: 14px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="https://conectasjc.com.br/" aria-label="Conecta — página inicial">
      <svg viewBox="0 0 44 44" role="img" aria-label="Símbolo do Conecta" xmlns="http://www.w3.org/2000/svg">
        <rect width="44" height="44" rx="12" fill="#0d4232"/>
        <g transform="rotate(-20 22 22)">
          <rect x="10" y="10" width="10" height="10" rx="3.1" fill="#9de0b7"/>
          <rect x="24" y="10" width="10" height="10" rx="3.1" fill="#e4f5de"/>
          <rect x="10" y="24" width="10" height="10" rx="3.1" fill="#e4f5de"/>
          <rect x="24" y="24" width="10" height="10" rx="3.1" fill="#4fb58f"/>
        </g>
      </svg>
      <span>conecta<span class="dot">.</span></span>
    </a>
    <main>
      <section class="content" aria-labelledby="page-title">
        <div class="code" aria-hidden="true">404</div>
        <h1 id="page-title">Página não encontrada.</h1>
        <p>O endereço que você procurou não existe ou não está mais disponível.</p>
        <a class="button" href="https://conectasjc.com.br/">Voltar ao início</a>
      </section>
    </main>
    <footer>© Conecta</footer>
  </div>
</body>
</html>
